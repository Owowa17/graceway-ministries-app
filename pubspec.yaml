name: graceway_ministries_app
description: "Graceway & Healing Ministries App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  url_launcher: ^6.2.6
  # ✅ Removed material_ui: ^1.0.0 (Not a real package)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

class LogoImage extends StatelessWidget {
  final double height;
  final String file;
  // ✅ Changed default to 'icon.png' since that's your logo file
  const LogoImage({super.key, this.height = 120, this.file = 'icon.png'});

  @override
  Widget build(BuildContext context) {
    return Image.asset(
      'assets/$file', // ✅ Changed to look in 'assets/' instead of 'assets/images/'
      height: height,
      errorBuilder: (_, __, ___) =>
          Icon(Icons.church, size: height * 0.6, color: kGold),
    );
  }
}
