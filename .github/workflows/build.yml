name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Point Flutter at Java 17
        run: flutter config --jdk-dir "$JAVA_HOME"

      - name: Back up my files
        run: |
          mkdir -p /tmp/keep
          cp -r lib /tmp/keep/lib
          cp pubspec.yaml /tmp/keep/pubspec.yaml

      - run: flutter create . --platforms=android --project-name=graceway_app

      # 👇 CRITICAL FIX: Downgrade Gradle, AGP, and disable the new DSL flag
      - name: Fix Gradle, AGP, and DSL
        run: |
          # Set Gradle wrapper to a stable version
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.10.2-all.zip|' android/gradle/wrapper/gradle-wrapper.properties
          
          # Downgrade AGP in settings.gradle.kts (or .gradle)
          if [ -f android/settings.gradle.kts ]; then
            sed -i 's|id("com.android.application") version ".*"|id("com.android.application") version "8.6.0"|' android/settings.gradle.kts
          elif [ -f android/settings.gradle ]; then
            sed -i 's|id "com.android.application" version ".*"|id "com.android.application" version "8.6.0"|' android/settings.gradle
          fi

          # Disable the new AGP DSL interface which is causing the Flutter plugin to fail
          echo "android.newDsl=false" >> android/gradle.properties

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore my files
        run: |
          cp -r /tmp/keep/lib/. lib/
          cp /tmp/keep/pubspec.yaml pubspec.yaml

      - name: Allow internet access
        run: sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml

      - run: flutter pub add http
      - run: flutter pub add url_launcher
      - run: flutter pub get

      - name: Generate app icon
        run: |
          if [ -s assets/images/icon.png ]; then
            flutter pub add --dev flutter_launcher_icons
            printf 'flutter_launcher_icons:\n  android: true\n  ios: false\n  image_path: "assets/images/icon.png"\n' > flutter_launcher_icons.yaml
            dart run flutter_launcher_icons || echo "Icon skipped"
          fi

      - name: Build APK (retries on network errors)
        run: |
          for i in 1 2 3; do
            flutter build apk --release --split-per-abi --target-platform android-arm64 && exit 0
            echo "Attempt $i failed, retrying in 20 seconds..."
            sleep 20
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: graceway-app-compact
          path: build/app/outputs/flutter-apk/*.apk
