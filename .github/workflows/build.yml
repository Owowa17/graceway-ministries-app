name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter and Java
        run: |
          flutter --version
          java -version
          flutter doctor -v

      - name: Generate Android project if missing
        run: |
          if [ ! -d android ]; then
            flutter create . \
              --platforms=android \
              --project-name=graceway_app
          fi

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: |
          flutter clean
          flutter pub get
          flutter pub add http
          flutter pub add url_launcher

      - name: Configure Internet permission
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi

      # 👇 Failsafe added: If the image is corrupt, it warns but DOES NOT crash the build.
      - name: Generate app icon (failsafe)
        run: |
          if [ -s assets/images/icon.png ]; then
            flutter pub add --dev flutter_launcher_icons
            cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/images/icon.png"
          EOF
            dart run flutter_launcher_icons || echo "⚠️ WARNING: Icon generation failed. Image likely corrupted. Continuing build..."
          fi

      # 👇 CRITICAL: Fixes the Gradle/AGP version crashes
      - name: Fix Gradle & AGP Versions
        run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.10.2-all.zip|' android/gradle/wrapper/gradle-wrapper.properties
          
          if [ -f android/settings.gradle.kts ]; then
            sed -i 's|id("com.android.application") version ".*"|id("com.android.application") version "8.7.3"|' android/settings.gradle.kts
          elif [ -f android/settings.gradle ]; then
            sed -i 's|id "com.android.application" version ".*"|id "com.android.application" version "8.7.3"|' android/settings.gradle
          fi
          
          echo "android.newDsl=false" >> android/gradle.properties
          echo "android.builtInKotlin=false" >> android/gradle.properties

      # 👇 CRITICAL: Uses debug signing so release build doesn't fail looking for a keystore
      - name: Configure Debug Signing for Release
        run: |
          BUILD_FILE=""
          if [ -f android/app/build.gradle ]; then BUILD_FILE="android/app/build.gradle";
          elif [ -f android/app/build.gradle.kts ]; then BUILD_FILE="android/app/build.gradle.kts"; fi
          if [ -n "$BUILD_FILE" ]; then
            sed -i 's/signingConfig = signingConfigs.release/signingConfig = signingConfigs.debug/' "$BUILD_FILE"
            sed -i 's/signingConfig = signingConfigs.getByName("release")/signingConfig = signingConfigs.getByName("debug")/' "$BUILD_FILE"
          fi

      - name: Build Android APK
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: graceway-app
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
