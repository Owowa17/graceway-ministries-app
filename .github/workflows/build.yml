name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean hidden characters
        run: |
          find lib -name "*.dart" -print0 | xargs -0 perl -CSD -pi -e 's/[\x{00A0}\x{202F}\x{2007}\x{3000}]/ /g; s/[\x{200B}\x{200C}\x{200D}\x{2060}\x{FEFF}]//g'
          echo "Cleaned."

      - name: Save cleaned code back to the repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add lib
          git diff --cached --quiet || git commit -m "Auto-clean hidden characters"
          git push || true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate missing platform folders
        run: flutter create --platforms=android --org org.graceway .

      - name: Remove generated test folder
        run: rm -rf test

      - name: Add Internet permission
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$MANIFEST" || sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"

      - name: Install dependencies
        run: flutter pub get

      - name: Check code for errors
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Generate App Icons
        run: dart run flutter_launcher_icons
        continue-on-error: true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: graceway-app-compact
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
