name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Point Flutter at Java 17
        run: flutter config --jdk-dir "$JAVA_HOME"

      - name: Back up my files
        run: |
          mkdir -p /tmp/keep
          cp -r lib /tmp/keep/lib
          cp pubspec.yaml /tmp/keep/pubspec.yaml

      - run: flutter create . --platforms=android --project-name=graceway_app

      # 👇 CRITICAL FIX: Upgrade Gradle to >= 8.14.0 and AGP to 8.11.1
      - name: Fix Gradle & AGP Versions
        run: |
          # Set Gradle wrapper to the minimum required version (8.14.0)
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.0-all.zip|' android/gradle/wrapper/gradle-wrapper.properties
          
          # Upgrade AGP to the compatible version (8.11.1)
          if [ -f android/settings.gradle.kts ]; then
            sed -i 's|id("com.android.application") version ".*"|id("com.android.application") version "8.11.1"|' android/settings.gradle.kts
          elif [ -f android/settings.gradle ]; then
            sed -i 's|id "com.android.application" version ".*"|id "com.android.application" version "8.11.1"|' android/settings.gradle
          fi

          # Disable the new AGP DSL interface to maintain Flutter plugin compatibility
          echo "android.newDsl=false" >> android/gradle.properties

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore my files
        run: |
          cp -r /tmp/keep/lib/. lib/
          cp /tmp/keep/pubspec.yaml pubspec.yaml

      - name: Allow internet access
        run: sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml

      - run: flutter pub add http
      - run: flutter pub add url_launcher
      - run: flutter pub get

      - name: Generate app icon
        run: |
          if [ -s assets/images/icon.png ]; then
            flutter pub add --dev flutter_launcher_icons
            printf 'flutter_launcher_icons:\n  android: true\n  ios: false\n  image_path: "assets/images/icon.png"\n' > flutter_launcher_icons.yaml
            dart run flutter_launcher_icons || echo "Icon skipped"
          fi

      # 👇 Temporarily use debug signing for release builds to bypass keystore errors
      - name: Configure Debug Signing for Release
        run: |
          BUILD_FILE=""
          if [ -f android/app/build.gradle ]; then BUILD_FILE="android/app/build.gradle";
          elif [ -f android/app/build.gradle.kts ]; then BUILD_FILE="android/app/build.gradle.kts"; fi
          
          if [ -n "$BUILD_FILE" ]; then
            sed -i 's/signingConfig = signingConfigs.release/signingConfig = signingConfigs.debug/' "$BUILD_FILE"
            sed -i 's/signingConfig = signingConfigs.getByName("release")/signingConfig = signingConfigs.getByName("debug")/' "$BUILD_FILE"
            echo "Patched $BUILD_FILE to use debug signing."
          fi

      - name: Build APK (retries on network errors, verbose on fail)
        run: |
          for i in 1 2 3; do
            flutter build apk --release --split-per-abi --target-platform android-arm64 --verbose && exit 0
            echo "Attempt $i failed, retrying in 20 seconds..."
            sleep 20
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: graceway-app-compact
          path: build/app/outputs/flutter-apk/*.apk
