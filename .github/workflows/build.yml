name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Point Flutter at Java 17
        run: flutter config --jdk-dir "$JAVA_HOME"

      - name: Back up my files
        run: |
          mkdir -p /tmp/keep
          cp -r lib /tmp/keep/lib
          cp pubspec.yaml /tmp/keep/pubspec.yaml

      - run: flutter create . --platforms=android --project-name=graceway_app

      - name: Setup Gradle Cache
        uses: gradle/gradle-build-action@v3

      - name: Restore my files
        run: |
          cp -r /tmp/keep/lib/. lib/
          cp /tmp/keep/pubspec.yaml pubspec.yaml

      - name: Allow internet access
        run: sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml

      - run: flutter pub add http
      - run: flutter pub add url_launcher
      - run: flutter pub get

      - name: Generate app icon
        run: |
          if [ -s assets/images/icon.png ]; then
            flutter pub add --dev flutter_launcher_icons
            printf 'flutter_launcher_icons:\n  android: true\n  ios: false\n  image_path: "assets/images/icon.png"\n' > flutter_launcher_icons.yaml
            dart run flutter_launcher_icons || echo "Icon skipped"
          fi

      - name: Build APK (retries on network errors)
        run: |
          for i in 1 2 3; do
            flutter build apk --release --split-per-abi --target-platform android-arm64 && exit 0
            echo "Attempt $i failed, retrying in 20 seconds..."
            sleep 20
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: graceway-app-compact
          path: build/app/outputs/flutter-apk/*.apk
