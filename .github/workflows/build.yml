name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate missing platform folders
        run: flutter create --platforms=android --org org.graceway .

      - name: Remove generated test folder
        run: rm -rf test

      - name: Add Internet permission
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$MANIFEST" || sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"

      - name: Install dependencies
        run: flutter pub get

      - name: Check code for errors
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Generate App Icons
        run: dart run flutter_launcher_icons
        continue-on-error: true

      - name: Build APK
        run: flutter build apk --release
        continue-on-error: true

      - name: Find APK files
        run: find . -name "*.apk" -not -path "./.git/*"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: graceway-app-compact
          path: |
            build/app/outputs/flutter-apk/*.apk
            android/app/build/outputs/**/*.apk
          if-no-files-found: error
