
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter environment
        run: |
          flutter --version
          flutter doctor -v

      - name: Generate Android project if missing
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android \
              --project-name=graceway_app
          fi

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Configure Internet permission
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi

      - name: Generate app icon
        run: |
          if [ -s assets/images/icon.png ]; then
            flutter pub add --dev flutter_launcher_icons
            cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/images/icon.png"
          EOF
            dart run flutter_launcher_icons
          fi

      - name: Build Android APK
        run: |
          set -o pipefail
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --verbose 2>&1 | tee build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: graceway-app
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graceway-build-logs
          path: build.log
          if-no-files-found: ignore
